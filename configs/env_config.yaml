# 环境配置
# =============================================================================  
# 仿真环境配置  
# =============================================================================  
  
simulation:  
  # 时间配置  
  dt: 0.02                      # 物理仿真步长 (s) - 50Hz  
  control_dt: 0.02              # 控制频率与仿真同步  
  max_episode_time: 300.0       # 最大episode时长 (s) - 增加时长，允许更长的episode  
    
  # 重力  
  gravity: [0.0, 0.0, 9.81]     # 重力加速度 (m/s²)  
    
# =============================================================================  
# 环境边界  
# =============================================================================  
  
world:  
  # 边界范围 (m)  
  x_range: [-50.0, 50.0]  
  y_range: [-50.0, 50.0]  
  z_range: [0.0, 50.0]          # z=0为水面，z>0为水下  
    
  # 水流配置  
  current:  
    enabled: true  
    type: "variable"            # "constant", "variable", "tidal"  
    base_velocity: [0.1, 0.05, 0.0]  # 基础水流速度 (m/s)  
    variation_amplitude: 0.1    # 水流变化幅度  
    variation_frequency: 0.05   # 水流变化频率 (Hz)  
  
# =============================================================================  
# 地形配置  
# =============================================================================  
  
terrain:  
  enabled: true  
  type: "procedural"            # "flat", "procedural", "imported"  
    
  # 程序化生成参数  
  procedural:  
    resolution: 1.0             # 地形网格分辨率 (m)  
    base_height: 45.0           # 海床基础高度 (z坐标)  
      
    # 障碍物  
    obstacles:  
      num_random: 20            # 随机障碍物数量  
      min_size: [1.0, 1.0, 1.0] # 最小尺寸  
      max_size: [5.0, 5.0, 8.0] # 最大尺寸  
        
    # 沟壑  
    canyons:  
      enabled: true  
      num_canyons: 3  
      min_depth: 5.0  
      max_depth: 15.0  
      min_width: 3.0  
      max_width: 10.0  
  
# =============================================================================  
# 传感器配置（用于观测空间）  
# =============================================================================  
  
sensors:  
  # 位置传感器  
  position:  
    noise_std: 0.1              # 位置噪声标准差 (m)  
    update_rate: 50.0           # 更新频率 (Hz)  
      
  # 姿态传感器 (IMU)  
  orientation:  
    noise_std: 0.02             # 姿态噪声 (rad)  
    update_rate: 100.0  
      
  # 速度传感器 (DVL)  
  velocity:  
    noise_std: 0.05             # 速度噪声 (m/s)  
    update_rate: 10.0  
      
  # 地形感知 (前视声呐)  
  terrain_sonar:  
    range: 20.0                 # 探测距离 (m)  
    fov_horizontal: 120.0       # 水平视场角 (度)  
    fov_vertical: 30.0          # 垂直视场角  
    resolution: 1.0             # 分辨率 (m)  
